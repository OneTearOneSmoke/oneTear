name: rust

on:
  push:
    branches: [main, new_frame]
    paths:
      - "services/exf/**"
      - "sdk/plugin-sdk-rust/**"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/exf/**"
      - "sdk/plugin-sdk-rust/**"

defaults:
  run:
    working-directory: services/exf

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/exf -> target
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/exf -> target
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/exf -> target
      - name: cargo test workspace
        run: cargo test --workspace --all-features

  sdk-test:
    name: plugin-sdk-rust test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/plugin-sdk-rust -> target
      - working-directory: sdk/plugin-sdk-rust
        run: cargo test
        env:
          CARGO_TERM_COLOR: always
