name: contracts

on:
  push:
    branches: [main, new_frame]
    paths:
      - "contracts/**"
      - ".github/workflows/contracts.yml"
  pull_request:
    branches: [main]
    paths:
      - "contracts/**"

jobs:
  buf-lint:
    name: buf lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action-setup@v1
        with:
          buf_version: "1.34.0"
      - name: buf lint
        run: cd contracts && buf lint

  buf-format:
    name: buf format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action-setup@v1
        with:
          buf_version: "1.34.0"
      - name: buf format --exit-code
        run: cd contracts && buf format --exit-code -d

  buf-breaking:
    name: buf breaking (vs main)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action-setup@v1
        with:
          buf_version: "1.34.0"
      - name: buf breaking
        run: |
          cd contracts
          buf breaking --against ".git#branch=origin/main,subdir=contracts/proto"

  buf-generate-go:
    name: buf generate (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action-setup@v1
        with:
          buf_version: "1.34.0"
      - name: buf generate (Go)
        run: |
          cd contracts
          buf generate --template '{"version":"v2","managed":{"enabled":true,"override":[{"file_option":"go_package_prefix","path":"github.com/aitest/contracts/gen/go"}]},"plugins":[{"remote":"buf.build/protocolbuffers/go","out":"gen/go"},{"remote":"buf.build/grpc/go","out":"gen/go"}]}'
      - name: list generated
        run: find contracts/gen/go -name "*.go" | head -10
