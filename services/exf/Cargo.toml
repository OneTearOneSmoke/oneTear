[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/scheduler",
    "crates/worker",
    "crates/broker",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/OneTearOneSmoke/oneTear"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"
thiserror = "1"
anyhow = "1"
bytes = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

aitest-core = { path = "crates/core" }
aitest-scheduler = { path = "crates/scheduler" }
aitest-worker = { path = "crates/worker" }
aitest-broker = { path = "crates/broker" }
